[package]
name = "mk-feed"
version = "0.1.0"
edition = "2021"
description = "Plan, schedule and publish posts from the terminal"
license = "MIT"

[[bin]]
name = "mk-feed"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
fs2 = "0.4"
